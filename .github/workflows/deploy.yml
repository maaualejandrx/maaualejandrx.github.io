name: Deploy Astro site to Pages

on:
  push:
    branches: ["main", "feat/migracion-a-root"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        # Se quitó el working-directory de aquí para que instale todo el workspace desde la raíz

      - name: Build Astro
        run: pnpm run build
        working-directory: minor-mercury # Mantiene este porque el script de build vive aquí

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./minor-mercury/dist # Sube la carpeta dist correcta